kind = "web"
previewPath = "/mystic/"
title = "Fandom Mystic Profile"
version = "1.0.0"
id = "artifacts/fandom-mystic"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/mystic/" ]
localPort = 18416

[services.development]
run = "pnpm --filter @workspace/fandom-mystic run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/fandom-mystic", "run", "build" ]
publicDir = "artifacts/fandom-mystic/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18416"
BASE_PATH = "/mystic/"
