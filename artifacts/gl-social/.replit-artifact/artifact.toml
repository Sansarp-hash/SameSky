kind = "web"
previewPath = "/"
title = "GL Social"
version = "1.0.0"
id = "artifacts/gl-social"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20268

[services.development]
run = "pnpm --filter @workspace/gl-social run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/gl-social", "run", "build" ]
publicDir = "artifacts/gl-social/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20268"
BASE_PATH = "/"
